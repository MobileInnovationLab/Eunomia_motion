name: CI/CD Deployment
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Eksekusi pull dan rebuild Docker
        run: |
          cd /home/motion/project/eunomia/Eunomia
          git pull origin main
          docker compose down
          docker compose build
          docker compose up -d
